kind = "web"
previewPath = "/landing/"
title = "Norovia Landing Page"
version = "1.0.0"
id = "artifacts/landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/landing/" ]
localPort = 18150

[services.development]
run = "pnpm --filter @workspace/landing run dev"

[services.production]
serve = "static"
publicDir = "dist/public"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/landing", "run", "build" ]

[services.production.build.env]
BASE_PATH = "/landing/"
PORT = "18150"

[services.env]
PORT = "18150"
BASE_PATH = "/landing/"
