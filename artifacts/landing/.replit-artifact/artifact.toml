kind = "web"
previewPath = "/"
title = "Norovia Landing Page"
version = "1.0.0"
id = "artifacts/landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18150

[services.development]
run = "pnpm --filter @workspace/landing run dev"

[services.production]
serve = "static"
publicDir = "artifacts/landing/dist/public"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/landing", "run", "build" ]

[services.production.build.env]
BASE_PATH = "/"
PORT = "18150"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "18150"
BASE_PATH = "/"
