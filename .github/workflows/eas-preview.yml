name: EAS Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-android:
    name: Build preview APK (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/pots-companion
    outputs:
      buildDetailsPageUrl: ${{ steps.build.outputs.buildDetailsPageUrl }}
      artifactUrl: ${{ steps.build.outputs.artifactUrl }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build preview (Android APK)
        id: build
        uses: expo/eas-build-action@v0
        with:
          type: build
          profile: preview
          platform: android
          working-directory: artifacts/pots-companion

  build-ios:
    name: Build preview (iOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/pots-companion
    outputs:
      buildDetailsPageUrl: ${{ steps.build.outputs.buildDetailsPageUrl }}
      artifactUrl: ${{ steps.build.outputs.artifactUrl }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build preview (iOS)
        id: build
        uses: expo/eas-build-action@v0
        with:
          type: build
          profile: preview
          platform: ios
          working-directory: artifacts/pots-companion

  comment:
    name: Post PR comment
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && needs.build-android.result != 'skipped' && needs.build-ios.result != 'skipped'
    permissions:
      pull-requests: write

    steps:
      - name: Comment build links on PR
        uses: actions/github-script@v7
        with:
          script: |
            const androidBuildUrl = '${{ needs.build-android.outputs.buildDetailsPageUrl }}';
            const androidArtifactUrl = '${{ needs.build-android.outputs.artifactUrl }}';
            const iosBuildUrl = '${{ needs.build-ios.outputs.buildDetailsPageUrl }}';
            const iosArtifactUrl = '${{ needs.build-ios.outputs.artifactUrl }}';

            const androidStatus = '${{ needs.build-android.result }}';
            const iosStatus = '${{ needs.build-ios.result }}';

            const androidSection = androidStatus === 'success'
              ? [
                  '### Android',
                  `**Build details:** ${androidBuildUrl}`,
                  androidArtifactUrl ? `**Download APK:** ${androidArtifactUrl}` : '_APK link will appear in the build details page once the build finishes._',
                ].join('\n')
              : '### Android\n_Build failed. Check the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details._';

            const iosSection = iosStatus === 'success'
              ? [
                  '### iOS',
                  `**Build details:** ${iosBuildUrl}`,
                  iosArtifactUrl ? `**Download build:** ${iosArtifactUrl}` : '_iOS build link will appear in the build details page once the build finishes._',
                ].join('\n')
              : '### iOS\n_Build failed. Check the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details._';

            const body = [
              '## Preview Builds Ready',
              '',
              androidSection,
              '',
              iosSection,
              '',
              '_Built with EAS on commit ${{ github.sha }}_',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
